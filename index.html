<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lilita+One&family=Nunito:wght@600;800&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ic:38px;--d:0;--bg0:#15151c;--fg0:#fff;--field0:#22222c;--line0:#3a3a4a;--focus:#7c7cff;--heart:#d81b3c;--radius:8px;--card-border:0 solid transparent;--card-fg:#111;--heart-off:rgba(0,0,0,.4);--card-shadow:none;--card-outline:rgba(0,0,0,.3)}
  html[data-theme=spring]{--bg0:linear-gradient(160deg,#eaf7e4,#fde6f0);--fg0:#2d4a2b;--field0:#fff;--line0:#a8d5a2;--focus:#f48fb1;--heart:#e91e63}
  html[data-theme=summer]{--bg0:linear-gradient(160deg,#fff1b8,#ffc98a);--fg0:#5a3200;--field0:#fffdf5;--line0:#ffb300;--focus:#00a6ed;--heart:#e53935}
  html[data-theme=winter]{--bg0:linear-gradient(160deg,#e8f3fb,#cfe3f5);--fg0:#16324f;--field0:#fff;--line0:#9cc7e8;--focus:#3b82c4;--heart:#c62839}
  html[data-theme=fall]{--bg0:linear-gradient(160deg,#3b2417,#5a2f14);--fg0:#ffe9d0;--field0:#4d3020;--line0:#a4571e;--focus:#ff8f00;--heart:#e53935}
  html[data-theme=cute]{--bg0:linear-gradient(160deg,#ffe4f1,#e9dcff);--fg0:#7a2c55;--field0:#fff;--line0:#ff9ccb;--focus:#ff5fa8;--heart:#ff3d8b;--radius:16px}
  html[data-theme=contrast]{--bg0:#000;--fg0:#fff;--field0:#000;--line0:#fff;--focus:#ffee00;--heart:#e00000;--card-border:2px solid #fff;--card-fg:#000;--card-outline:#fff}
  html[data-theme=invert]{--bg0:#eae3e3;--fg0:#000;--field0:#ddddd3;--line0:#c5c5b5;--focus:#838300;--heart:#d81b3c;--card-fg:#eee;--heart-off:rgba(255,255,255,.55);--card-outline:rgba(255,255,255,.35)}
  html[data-theme=brawl]{--bg0:linear-gradient(170deg,#1b2a8a,#5b21b6);--fg0:#fff;--field0:#0f1a5c;--line0:#ffd400;--focus:#ffd400;--heart:#ffffff;--radius:6px;--card-border:3px solid #000;--card-fg:#fff;--heart-off:rgba(255,255,255,.55);--card-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;--card-outline:#000}
  /* dark slider (--d, 0 to 1) blends every theme toward dark */
  html{
    --bg:linear-gradient(rgba(8,8,16,calc(var(--d)*.9)),rgba(8,8,16,calc(var(--d)*.9))),var(--bg0);
    --fg:color-mix(in srgb,#eaeaf2 calc(var(--d)*100%),var(--fg0));
    --field:color-mix(in srgb,#1c1c26 calc(var(--d)*100%),var(--field0));
    --line:color-mix(in srgb,#40404f calc(var(--d)*100%),var(--line0));
    min-height:100%;background:var(--bg);background-attachment:fixed}
  .row,.chip,.pill,#tabs button,#loop rect{filter:brightness(calc(1 - var(--d)*.3))}
  body{margin:0;min-height:100vh;box-sizing:border-box;color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
  input,select,button,textarea{font-family:inherit}
  h1{font-size:18px;margin:0 0 10px}
  html[data-theme=brawl] h1{color:#ffd400;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
  #controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-bottom:10px;font-size:13px}
  #controls label{display:flex;align-items:center;gap:6px}
  select{padding:6px 8px;border-radius:var(--radius);border:2px solid var(--line);background:var(--field);color:var(--fg);font-size:13px}
  input[type=range]{width:110px;accent-color:var(--focus)}
  #darkVal{min-width:3ch;text-align:right}
  input#q{width:100%;max-width:420px;padding:14px 16px;font-size:18px;border-radius:calc(var(--radius) + 2px);border:2px solid var(--line);background:var(--field);color:var(--fg);outline:none;box-sizing:border-box}
  input#q:focus{border-color:var(--focus)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;color:var(--card-fg);text-shadow:var(--card-shadow);font-weight:700;border:var(--card-border)}
  .pill.hasicon{display:inline-flex;align-items:center;padding-left:4px}
  .pill img.trait{height:18px;margin:0 5px 0 0}
  .pill.neutral{background:var(--field);color:var(--fg);text-shadow:none;border:2px dashed var(--line)}
  #counters{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;max-width:960px;margin-top:12px;font-size:12px}
  #counters .chip{padding:3px 9px;border-radius:999px;color:var(--card-fg);text-shadow:var(--card-shadow);font-weight:700;border:var(--card-border)}
  #counters .arr{opacity:.75}
  #tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:960px;margin-top:12px}
  #tabs button{padding:6px 12px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:13px;color:var(--card-fg);text-shadow:var(--card-shadow);cursor:pointer;opacity:.8}
  #tabs button:hover{opacity:1}
  #tabs button.active{opacity:1;border-color:var(--fg);box-shadow:0 0 0 2px var(--bg)}
  html[data-theme=brawl] #tabs button{border-color:#000}
  html[data-theme=brawl] #tabs button.active{border-color:#ffd400}
  details#io{width:100%;max-width:960px;margin-top:10px;font-size:13px}
  details#io summary{cursor:pointer;text-align:center;opacity:.85}
  #ioBody{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  #favtext{width:100%;box-sizing:border-box;min-height:56px;padding:8px;border-radius:var(--radius);border:2px solid var(--line);background:var(--field);color:var(--fg);font-size:13px;resize:vertical}
  #ioBtns{display:flex;flex-wrap:wrap;gap:6px}
  #ioBtns button{padding:6px 12px;border-radius:var(--radius);border:2px solid var(--line);background:var(--field);color:var(--fg);font-size:13px;cursor:pointer}
  #ioBtns button:hover{border-color:var(--focus)}
  #iostat{opacity:.85;min-height:1em}
  #info{margin-top:10px;font-size:13px;text-align:center;line-height:1.9}
  #results{width:100%;max-width:960px;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
  .row{position:relative;display:flex;flex-direction:column;justify-content:center;padding:6px 30px 6px 10px;min-height:calc(var(--ic) + 10px);box-sizing:border-box;border-radius:var(--radius);border:var(--card-border);color:var(--card-fg);text-shadow:var(--card-shadow);font-weight:700;font-size:14px;line-height:1.2}
  .row .cat{font-weight:600;font-size:11px;opacity:.85}
  .row.selectable{cursor:pointer}
  .row.selectable:focus-visible{outline:2px dotted var(--fg);outline-offset:2px}
  .row.selected{outline:3px solid var(--focus);outline-offset:2px}
  .heart{position:absolute;top:50%;right:6px;transform:translateY(-50%);background:none;border:0;font-size:18px;cursor:pointer;color:var(--heart-off);padding:2px;line-height:1;text-shadow:none}
  .heart:hover{transform:translateY(-50%) scale(1.2)}
  .heart.on{color:var(--heart)}
  .none{grid-column:1/-1;opacity:.7;text-align:center;margin-top:8px}
  #graphWrap{width:100%;max-width:960px;margin-top:28px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
  .panel{flex:1 1 320px;max-width:460px;text-align:center}
  .panel h2{font-size:14px;margin:0 0 6px}
  .panel small{display:block;opacity:.75;font-size:12px;margin-top:4px}
  #loop{width:100%;height:auto;color:var(--fg)}
  #loop rect{stroke:var(--card-outline);stroke-width:2}
  #loop text{font-family:inherit;font-weight:700;font-size:13px;fill:var(--card-fg);paint-order:stroke;stroke:var(--card-outline-text,none);stroke-width:3px}
  html[data-theme=brawl] #loop text{--card-outline-text:#000}
  html[data-theme=brawl] #loop rect{stroke-width:3}
  #modes{display:flex;flex-direction:column;gap:6px;text-align:left}
  .mode{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);background:var(--field);border:2px solid var(--line);font-size:13px}
  .mode .mname{font-weight:700;flex:0 0 108px}
  .mode .needs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .mode .note{font-weight:600;font-style:italic;opacity:.8;margin-left:4px}
  /* fun mode */
  #scrollbar{position:fixed;top:0;left:0;height:5px;width:0;z-index:1000;display:none;border-radius:0 4px 4px 0}
  html.fun #scrollbar{display:block}
  html.fun .reveal:not(.in){opacity:0}
  html.fun .reveal.in{animation:rise .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--dl,0ms)}
  html.fun .row:hover{animation:wiggle .5s ease-in-out}
  /* hovering a card while it is still fading in must not swap its animation (that left it invisible) */
  html.fun .row.reveal.in:hover{animation:rise .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--dl,0ms)}
  html.fun .row.pop{animation:pop .45s ease-out}
  html.fun #tabs button{transition:transform .15s}
  html.fun #tabs button:hover{transform:translateY(-3px) rotate(-2deg)}
  html.fun #tabs button.pop{animation:pop .45s ease-out}
  html.fun .mode{transition:transform .2s}
  html.fun .mode:hover{transform:translateX(8px)}
  html.fun #results{transform:skewY(calc(var(--tilt,0)*1deg))}
  html.fun #loop line{stroke-dasharray:6 6;animation:march .6s linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(34px) scale(.8) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) scale(1.05) rotate(1deg)}100%{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(.85)}65%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
  @keyframes march{to{stroke-dashoffset:-12}}
  /* traits */
  img.trait{height:var(--ic);width:auto;display:block;user-select:none;-webkit-user-select:none}
  .row{--icr:var(--ic)}
  .row.t3{--icr:28px}
  .row img.trait{height:var(--icr)}
  .row .traits{position:absolute;top:50%;right:34px;transform:translateY(-50%);display:flex;gap:2px}
  .row.t1{padding-right:calc(36px + var(--icr) + 8px)}
  .row.t2{padding-right:calc(36px + var(--icr)*2 + 10px)}
  .row.t3{padding-right:calc(36px + var(--icr)*3 + 12px)}
  /* tab icons: sized to sit inside a normal-height tab (negative margins keep the tab from growing) */
  #tabs button .kb{margin-right:5px;opacity:.75;font-weight:600}
  #tabs button.hasicon{display:inline-flex;align-items:center}
  #tabs button img.trait{height:24px;margin:-4px 6px -4px 0}
  html.fun img.trait{cursor:pointer}
  html.fun img.trait[data-trait=DPS]:hover{animation:tspin .8s linear infinite}
  html.fun img.trait[data-trait=Wallbreaker]:hover{animation:twobble .3s ease-in-out infinite}
  html.fun img.trait[data-trait=Wallneeder]:hover{animation:tpeek .9s ease-in-out infinite}
  html.fun img.trait[data-trait].spin{animation:tfire .7s ease-out}
  html.fun img.trait[data-trait].build{animation:tbuild .6s ease-out}
  html.fun img.trait[data-trait].smash{animation:tsmash .55s cubic-bezier(.2,1.6,.4,1)}
  html.fun .row.shake{animation:shake .4s ease-in-out}
  @keyframes tspin{from{transform:rotate(0) scale(1.35)}to{transform:rotate(360deg) scale(1.35)}}
  @keyframes twobble{0%,100%{transform:rotate(-12deg) scale(1.35)}50%{transform:rotate(12deg) scale(1.35)}}
  @keyframes tfire{0%{transform:rotate(0) scale(1)}60%{transform:rotate(540deg) scale(1.9)}100%{transform:rotate(720deg) scale(1)}}
  @keyframes tpeek{0%,100%{transform:translateX(0) scale(1.3)}50%{transform:translateX(-6px) rotate(-6deg) scale(1.3)}}
  @keyframes tbuild{0%{transform:scale(1)}40%{transform:translateY(-8px) scale(1.2)}70%{transform:translateY(0) scale(.75,.9)}85%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes tsmash{0%{transform:scale(1)}25%{transform:scale(.5) rotate(-15deg)}55%{transform:scale(2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  /* fonts that only have one weight */
  body[data-font=pixel] *,body[data-font=brawl] *,body[data-font=impact] *{font-weight:400!important}
  body[data-font=pixel] #results{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
  body[data-font=pixel] .row{font-size:10px}
  body[data-font=pixel] .row .cat{font-size:8px}
  body[data-font=pixel] #loop text{font-size:8px}
  body[data-font=pixel] .mode,body[data-font=pixel] .pill{font-size:8px}
  body[data-font=pixel] .mode .mname{flex-basis:96px}
  body[data-font=pixel] #tabs button,body[data-font=pixel] #counters,body[data-font=pixel] #info,body[data-font=pixel] #controls,body[data-font=pixel] details#io,body[data-font=pixel] select,body[data-font=pixel] #ioBtns button,body[data-font=pixel] #favtext,body[data-font=pixel] .panel small{font-size:10px}
  body[data-font=pixel] h1{font-size:14px}
  body[data-font=pixel] input#q{font-size:14px}
  body[data-font=brawl] .row{font-size:16px}
</style>
</head>

// A colored label for a category (neutral if it isn't a category, e.g. "DPS Trait")
function pill(n, label) {
  const s = document.createElement("span");
  s.className = "pill"; s.textContent = label || n;
  const TP = {"DPS Trait":"DPS", "Wallbreaker":"Wallbreaker"};   // pills styled like their trait tab: color + icon
  if (TP[n]) {
    s.style.background = color(TP[n]);
    s.classList.add("hasicon");
    s.prepend(traitImg(TP[n]));
    return s;
  }
  const HALF = {"Pushtain":["Push","Sustain"], "DPS Pusher":["DPS","Push"], "DPS Sustainer":["DPS","Sustain"]};   // half / half pills
  if (HALF[n]) {
    s.style.background = `linear-gradient(90deg, ${color(HALF[n][0])} 50%, ${color(HALF[n][1])} 50%)`;
    return s;
  }
  const c = color(n);
  if (c) s.style.background = c; else s.classList.add("neutral");
  return s;
}

// Counter loop graph
function buildLoop() {
  const cx = 230, cy = 150, rx = 160, ry = 125, hw = 62, hh = 18, gap = 6;
  const pts = cycle.map((n, i) => {
    const a = (-90 + 72*i) * Math.PI / 180;
    return {n, x: cx + rx*Math.cos(a), y: cy + ry*Math.sin(a)};
  });
  let s = '<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>';
  pts.forEach((p, i) => {
    const n = pts[(i+1) % pts.length];
    const dx = n.x - p.x, dy = n.y - p.y;
    const t = Math.min((hw+gap)/Math.abs(dx || 1e-9), (hh+gap)/Math.abs(dy || 1e-9));
    s += `<line x1="${p.x+dx*t}" y1="${p.y+dy*t}" x2="${n.x-dx*t}" y2="${n.y-dy*t}" stroke="currentColor" stroke-width="2.5" marker-end="url(#arr)"/>`;
  });
  pts.forEach(p => {
    s += `<rect x="${p.x-hw}" y="${p.y-hh}" width="${hw*2}" height="${hh*2}" rx="10" fill="${color(p.n)}"/>` +
         `<text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="central">${p.n}</text>`;
  });
  loop.innerHTML = s;
}

// Mode guide graph
function buildModes() {
  modesEl.innerHTML = "";
  modeGuide.forEach(([mode, needs, note]) => {
    const row = document.createElement("div"); row.className = "mode";
    const name = document.createElement("span"); name.className = "mname"; name.textContent = mode;
    const box = document.createElement("span"); box.className = "needs";
    needs.forEach(n => box.appendChild(pill(n)));
    if (note) { const t = document.createElement("span"); t.className = "note"; t.textContent = note; box.appendChild(t); }
    row.append(name, box);
    modesEl.appendChild(row);
  });
}

// Map types table
function buildMaps() {
  mapsEl.innerHTML = "";
  mapsEl.style.cssText = "display:flex;flex-direction:column;gap:6px;text-align:left";
  mapGuide.forEach(([map, cat, label]) => {
    const row = document.createElement("div"); row.className = "mode";
    const name = document.createElement("span"); name.className = "mname"; name.textContent = map;
    const box = document.createElement("span"); box.className = "needs";
    const pl = pill(cat, label); pl.style.borderRadius = "14px"; box.appendChild(pl);
    row.append(name, box);
    mapsEl.appendChild(row);
  });
}

const FAV = {name:"♥ Favorites"};
const ALL = {name:"Everybody"};
const key = t => t === ALL ? "all" : t === FAV ? "fav" : t.name;
const DPS_T = {name:"DPS", trait:"DPS"}, WALL_T = {name:"Wallbreaker", trait:"Wallbreaker"}, WNEED_T = {name:"Wallneeders", trait:"Wallneeder"};
let active = null;
const tabBtns = [];
[ALL, ...tiers, DPS_T, WALL_T, WNEED_T, FAV].forEach(t => {
  const b = document.createElement("button");
  b.textContent = t.name;
  if (t.trait) { b.prepend(traitImg(t.trait)); b.classList.add("hasicon"); }
  b._t = t;
  b.onclick = () => selectTab(b);
  tabs.appendChild(b); tabBtns.push(b);
});
function selectTab(b) {
  active = active === b._t ? null : b._t;
  q.value = "";
  tabBtns.forEach(c => c.classList.toggle("active", active && c === b));
  render();
}

// Keybinds: 1-7 = Everybody + the six categories, 8 = DPS, 9 = Wallbreaker, 0 = Favorites (top row or numpad).
// D, W and F also still work, and N opens Wallneeders. "/" or a tap of Left Shift toggles the search box.
const hotkeys = {};
const numbered = [ALL, ...tiers];
tabBtns.forEach(b => {
  const t = b._t;
  const ks = t === FAV ? ["0", "f"] : t === DPS_T ? ["8", "d"] : t === WALL_T ? ["9", "w"] : t === WNEED_T ? ["n"] : [String(numbered.indexOf(t) + 1)];
  ks.forEach(k => hotkeys[k] = b);
  b.title = "Shortcut" + (ks.length > 1 ? "s" : "") + ": " + ks.map(k => k.toUpperCase()).join(" or ");
  b.setAttribute("aria-keyshortcuts", ks.map(k => k.toUpperCase()).join(" "));
  const kb = document.createElement("span");   // the little [1] indicator before the tab name
  kb.className = "kb"; kb.textContent = "[" + ks[0] + "]";
  b.prepend(kb);
});
const toggleSearch = t => { t === q ? q.blur() : q.focus(); };
const NOT_TYPING = "textarea, select, input[type=range], input[type=checkbox]";
let shiftTap = false;   // true while Left Shift is down and nothing else has happened yet
document.addEventListener("mousedown", () => { shiftTap = false; });
document.addEventListener("keyup", e => {
  if (e.code !== "ShiftLeft" || !shiftTap) return;
  shiftTap = false;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && t.closest && t.closest(NOT_TYPING)) return;
  toggleSearch(t);
});
document.addEventListener("keydown", e => {
  if (e.code === "ShiftLeft") { if (!e.repeat) shiftTap = true; return; }
  shiftTap = false;   // Shift was just used for a capital letter or a combo, not a tap
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const t = e.target;
  if (t === q && e.key === "Escape") { q.blur(); return; }
  if (t && t.closest && t.closest(NOT_TYPING)) return;
  if (e.key === "/") { e.preventDefault(); toggleSearch(t); return; }
  // e.code covers the top row and the numpad (even with NumLock off)
  const m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code || "");
  const lk = e.key && e.key.length === 1 ? e.key.toLowerCase() : "";
  const k = m ? m[1] : /[a-z]/.test(lk) ? lk : null;
  if (!k || !hotkeys[k]) return;
  if ((k === "8" || /[a-z]/.test(k)) && t === q) return;   // letters and 8 stay typeable in the search box (Fang, 8-Bit)
  e.preventDefault();
  if (t === q) q.blur();
  selectTab(hotkeys[k]);
  if (fun) replay(hotkeys[k], "pop");
});
function clearTab() {
  active = null;
  tabBtns.forEach(c => c.classList.remove("active"));
}
q.addEventListener("input", () => { clearTab(); render(); });

function recolor() {
  tabBtns.forEach(b => b.style.background = color(key(b._t)));
  chips.forEach(c => c.el.style.background = color(c.n));
  buildLoop();
  buildModes();
  buildMaps();
  scrollbar.style.background = "linear-gradient(90deg," + cycle.map(n => color(n)).join(",") + ")";
  render();
}

// Export / import favorites as plain text, e.g. [Shelly,Poco,Bull]. The order of the list IS the favorites order (first = top).
const favtext = document.getElementById("favtext"), iostat = document.getElementById("iostat");
document.getElementById("btnExport").onclick = () => {
  const s = "[" + [...favs].join(",") + "]";
  favtext.value = s;
  favtext.select();
  iostat.textContent = "Exported " + favs.size + " favorite" + (favs.size === 1 ? "" : "s") + " in your current order.";
  try {
    navigator.clipboard.writeText(s).then(
      () => iostat.textContent += " Copied to clipboard.",
      () => iostat.textContent += " Select and copy the text above."
    );
  } catch (e) { iostat.textContent += " Select and copy the text above."; }
};
function importFavs(replace) {
  const raw = favtext.value.trim().replace(/^\[/, "").replace(/\]$/, "");
  // the order written is the order kept; leading numbers like "1. Shelly" are ignored
  const parts = raw.split(/[,\n]/).map(s => s.trim().replace(/^\d+[.)]\s+/, "")).filter(Boolean);
  const found = new Set(), bad = [];
  parts.forEach(p => {
    const b = brawlers.find(b => names(b).includes(norm(p)));
    b ? found.add(b.n) : bad.push(p);
  });
  // replace: exactly the imported order. merge: my other favorites stay first, then the imported ones in their imported order
  favs = replace ? found : new Set([...[...favs].filter(n => !found.has(n)), ...found]);
  saveFavs();
  render();
  iostat.textContent = "Imported " + found.size + " in the listed order." + (bad.length ? " Not recognized: " + bad.join(", ") : "");
}
document.getElementById("btnMerge").onclick = () => importFavs(false);
document.getElementById("btnReplace").onclick = () => importFavs(true);

// "Kill Confirm counters Area Control · countered by Push", each name in its category color
function setInfo(name) {
  info.textContent = "";
  const c = counters(name), cb = counteredBy(name);
  if (!c) return;
  info.append(pill(name), " counters ", pill(c), "  ·  countered by ", pill(cb));
}

// Favorites: click one to select it (only one at a time), then reorder it with the arrow keys
let selFav = null;
const FAV_HINT = "Click a favorite to select it, then use the arrow keys to move it. Press Esc to deselect.";
function favHint() {
  info.textContent = selFav ? "Moving " + selFav + ": use the arrow keys (Esc to deselect)." : FAV_HINT;
}
function setSelected(name) {
  selFav = name;
  [...out.children].forEach(c => c.classList.toggle("selected", !!name && c.dataset.name === name));
  favHint();
}
function moveFav(delta) {
  const kids = [...out.children].filter(c => c.dataset.name);
  const i = kids.findIndex(c => c.dataset.name === selFav);
  if (i < 0) return;
  const j = Math.max(0, Math.min(kids.length - 1, i + delta));
  if (j === i) return;
  const el = kids[i];
  out.insertBefore(el, j > i ? kids[j].nextSibling : kids[j]);
  favs = new Set([...out.children].map(c => c.dataset.name).filter(Boolean));
  saveFavs();
  el.scrollIntoView({block: "nearest"});
}
document.addEventListener("keydown", e => {
  if (active !== FAV || !selFav) return;
  const t = e.target;
  if (t && t.closest && t.closest("textarea, select, input[type=range], input[type=checkbox]")) return;
  if (t === q && q.value) return;
  if (e.key === "Escape") { setSelected(null); return; }
  const cols = Math.max(1, getComputedStyle(out).gridTemplateColumns.split(" ").length);
  const d = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-cols, ArrowDown:cols}[e.key];
  if (!d) return;
  e.preventDefault();
  moveFav(d);
});

function render() {
  const v = norm(q.value);
  out.innerHTML = "";
  info.textContent = "";
  if (active !== FAV || !favs.has(selFav)) selFav = null;
  let hits;
  if (active === FAV) {
    hits = [...favs].map(n => brawlers.find(b => b.n === n)).filter(Boolean);
    if (!hits.length) { out.innerHTML = '<div class="none">No favorites yet. Click the ♥ on a brawler.</div>'; return; }
    favHint();
  } else if (active === ALL) {
    hits = [...brawlers].sort((a, b) => a.n.localeCompare(b.n));
  } else if (active && active.trait) {
    hits = brawlers.filter(b => b.traits.includes(active.trait)).sort((a, b) => a.n.localeCompare(b.n));
    if (!hits.length) { out.innerHTML = '<div class="none">No brawlers have this trait yet.</div>'; return; }
  } else if (active) {
    hits = brawlers.filter(b => b.cats.includes(active));
    setInfo(active.name);
  } else {
    if (!v) return;
    const starts = brawlers.filter(b => names(b).some(x => x.startsWith(v)));
    const contains = brawlers.filter(b => !starts.includes(b) && names(b).some(x => x.includes(v)));
    hits = starts.concat(contains).slice(0, 60);
  }
  if (!hits.length) { out.innerHTML = '<div class="none">No brawler found</div>'; return; }
  let ri = 0;
  for (const b of hits) {
    const d = document.createElement("div");
    d.className = "row";
    if (fun) { d.classList.add("reveal"); d.style.setProperty("--dl", Math.min(ri++, 12) * 35 + "ms"); io.observe(d); }
    d.style.background = b.cats.length > 1
      ? `linear-gradient(90deg, ${color(b.cats[0].name)} 50%, ${color(b.cats[1].name)} 50%)`
      : color(b.cats[0].name);
    const l = document.createElement("span"); l.append(b.n);
    const r = document.createElement("span"); r.className = "cat";
    r.textContent = b.cats.map(c => c.name).join(" + ");
    const h = document.createElement("button");
    h.className = "heart" + (favs.has(b.n) ? " on" : "");
    h.textContent = favs.has(b.n) ? "♥" : "♡";
    h.title = "Favorite";
    h.onclick = () => {
      favs.has(b.n) ? favs.delete(b.n) : favs.add(b.n);
      heartState = favs.has(b.n);
      saveFavs();
      if (active === FAV) render();
      else { h.classList.toggle("on", favs.has(b.n)); h.textContent = favs.has(b.n) ? "♥" : "♡"; }
    };
    d.dataset.name = b.n;
    if (active === FAV) {
      d.classList.add("selectable");
      if (selFav === b.n) d.classList.add("selected");
      d.tabIndex = 0;
      d.title = "Click to select, then use the arrow keys to move";
      d.onclick = ev => { if (!ev.target.closest(".heart")) setSelected(selFav === b.n ? null : b.n); };
      d.onkeydown = ev => {
        if (ev.target === d && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); setSelected(selFav === b.n ? null : b.n); }
      };
    }
    if (b.traits.length) {
      const tw = document.createElement("span"); tw.className = "traits";
      b.traits.forEach(k => tw.appendChild(traitImg(k)));
      d.classList.add("t" + b.traits.length);
      d.append(tw);
    }
    d.append(l, r, h);
    out.appendChild(d);
  }
}

// Fun mode: click bursts, hover wiggles, scroll reveals + tilt + progress bar
const funChk = document.getElementById("funChk"), scrollbar = document.getElementById("scrollbar");
let fun = false, heartState = false, lastY = window.scrollY, tilt = 0, raf = 0;
const io = new IntersectionObserver(es => es.forEach(en => {
  if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
}), {threshold: .08});
function applyFun(on) {
  fun = !!on;
  document.documentElement.classList.toggle("fun", fun);
  funChk.checked = fun; putSet("brawlerFun", fun ? "1" : "0");
  io.disconnect();
  document.querySelectorAll(".reveal").forEach(el => el.classList.remove("reveal", "in"));
  if (fun) document.querySelectorAll(".panel, #counters").forEach(el => { el.classList.add("reveal"); io.observe(el); });
  onScroll();
}
funChk.onchange = () => applyFun(funChk.checked);
document.addEventListener("animationend", e => {
  const t = e.target;
  if (e.animationName === "rise") { t.classList.remove("reveal", "in"); t.style.removeProperty("--dl"); }
  else if (e.animationName === "pop") t.classList.remove("pop");
  else if (e.animationName === "tfire") t.classList.remove("spin");
  else if (e.animationName === "tsmash") t.classList.remove("smash");
  else if (e.animationName === "tbuild") t.classList.remove("build");
  else if (e.animationName === "shake") t.classList.remove("shake");
});
const rand = (a, b) => a + Math.random() * (b - a);
function particle(x, y, ch, o) {
  const el = document.createElement("span");
  el.textContent = ch;
  Object.assign(el.style, {position:"fixed", left:x+"px", top:y+"px", zIndex:9999, pointerEvents:"none", fontSize:o.size+"px", color:o.color||"", lineHeight:1, textShadow:"0 0 3px rgba(0,0,0,.35)", marginLeft:"-.5em", marginTop:"-.5em"});
  document.body.appendChild(el);
  el.animate([
    {transform:"translate(0,0) scale(1) rotate(0deg)", opacity:1},
    {transform:`translate(${o.dx}px,${o.dy}px) scale(${o.end||.3}) rotate(${rand(-360,360)}deg)`, opacity:0}
  ], {duration:o.dur, easing:"cubic-bezier(.15,.8,.3,1)"}).onfinish = () => el.remove();
}
function burst(x, y, n) {
  const cols = Object.values(palettes[curTheme] || palettes.default);
  const shapes = ["★","✦","●","♦","✿"];
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), d = rand(40, 110);
    particle(x, y, shapes[i % shapes.length], {size:rand(12, 22), color:cols[i % cols.length], dx:Math.cos(a) * d, dy:Math.sin(a) * d, dur:rand(600, 1000)});
  }
}
function floatHearts(x, y, ch) {
  for (let i = 0; i < 7; i++) particle(x + rand(-12, 12), y, ch, {size:rand(14, 24), dx:rand(-40, 40), dy:-rand(70, 150), dur:rand(800, 1300), end:1.2});
}
function ripple(x, y) {
  const el = document.createElement("div");
  const c = getComputedStyle(document.documentElement).getPropertyValue("--focus").trim() || "#7c7cff";
  Object.assign(el.style, {position:"fixed", left:x+"px", top:y+"px", width:"20px", height:"20px", marginLeft:"-10px", marginTop:"-10px", border:"3px solid " + c, borderRadius:"50%", zIndex:9999, pointerEvents:"none"});
  document.body.appendChild(el);
  el.animate([{transform:"scale(.3)", opacity:.9}, {transform:"scale(5)", opacity:0}], {duration:600, easing:"ease-out"}).onfinish = () => el.remove();
}
// Trait icons in fun mode: DPS spins and sprays bullets, Wallbreaker smashes and throws bricks
function liftRow(img) {
  const row = img.closest(".row"); if (!row) return;
  row.style.zIndex = 5; setTimeout(() => row.style.zIndex = "", 900);
}
function traitFx(img, x, y) {
  if (img.dataset.trait === "DPS") {
    const r = img.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    replay(img, "spin"); liftRow(img);
    for (let i = 0; i < 8; i++) setTimeout(() => particle(x, y + rand(-6, 6), "●", {size:rand(7, 11), color:"#ffd23f", dx:rand(130, 220), dy:rand(-14, 14), dur:450, end:.6}), i * 45);
    setTimeout(() => particle(cx, cy, "💥", {size:34, dx:0, dy:0, dur:500, end:1.4}), 380);   // explosion lands on the icon itself
  } else if (img.dataset.trait === "Wallneeder") {
    // bricks drop in and stack up on the icon, which hops and squashes as the wall goes up
    const r = img.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    replay(img, "build"); liftRow(img);
    for (let i = 0; i < 5; i++) setTimeout(() => particle(cx + (i - 2) * 13, cy - 70, "🧱", {size:16, dx:0, dy:64, dur:420, end:1}), i * 70);
    setTimeout(() => particle(cx, cy, "🛡️", {size:30, dx:0, dy:-6, dur:500, end:1.5}), 380);
  } else {
    replay(img, "smash"); liftRow(img);
    const row = img.closest(".row"); if (row) replay(row, "shake");
    particle(x, y, "💥", {size:30, dx:0, dy:0, dur:400, end:1.6});
    for (let i = 0; i < 7; i++) particle(x, y, "🧱", {size:rand(12, 20), dx:rand(-90, 90), dy:rand(20, 110), dur:rand(700, 1000), end:.4});
  }
}
function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
document.addEventListener("click", e => {
  if (!fun) return;
  const t = e.target;
  if (t.closest("input, select, textarea, summary, #ioBtns")) return;
  if (t.closest(".heart")) return floatHearts(e.clientX, e.clientY, heartState ? "❤️" : "💔");
  const tr = t.closest(".row img.trait");
  if (tr) return traitFx(tr, e.clientX, e.clientY);
  const card = t.closest(".row");
  if (card) { if (card.isConnected) replay(card, "pop"); return burst(e.clientX, e.clientY, 8); }
  const tab = t.closest("#tabs button");
  if (tab) { replay(tab, "pop"); return burst(e.clientX, e.clientY, 14); }
  ripple(e.clientX, e.clientY);
});
function onScroll() {
  if (!fun) { scrollbar.style.width = "0"; document.documentElement.style.removeProperty("--tilt"); return; }
  const h = document.documentElement.scrollHeight - innerHeight;
  scrollbar.style.width = (h > 0 ? scrollY / h * 100 : 0) + "%";
  const dy = scrollY - lastY; lastY = scrollY;
  tilt = Math.max(-3, Math.min(3, tilt + dy * 0.06));
  if (!raf) raf = requestAnimationFrame(decay);
}
function decay() {
  tilt *= 0.9;
  if (Math.abs(tilt) < 0.02) { tilt = 0; raf = 0; }
  else raf = requestAnimationFrame(decay);
  document.documentElement.style.setProperty("--tilt", tilt.toFixed(2));
}
addEventListener("scroll", onScroll, {passive:true});

ready = true;
recolor();
applyFun(getSet("brawlerFun") === "1");
</script>
</body>
